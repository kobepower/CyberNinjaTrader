name: cyberninja-trader

channels:
  - conda-forge
  - defaults

dependencies:
  # Python version
  - python=3.9.*

  # Core GUI Framework
  - pyqt=5.*

  # Financial Data & Analysis
  - yfinance>=0.2.18
  - pandas>=1.5.0
  - numpy>=1.21.0
  - pandas-ta>=0.3.14b0

  # Async & Messaging (Conda-available)
  - aio-pika>=9.0.0
  - aiohttp>=3.8.0
  - aiofiles>=23.0.0
  - websockets>=11.0.0
  - websocket-client>=1.6.0

  # HTTP Requests
  - requests>=2.28.0

  # Excel/Spreadsheet Support
  - openpyxl>=3.1.0

  # Database
  - sqlite

  # System Monitoring
  - psutil>=5.9.0

  # Timezone Support
  - pytz>=2022.1

  # Terminal Colors
  - colorama>=0.4.6

  # Caching & Rate Limiting
  - cachetools>=5.2.0
  - ratelimit>=2.2.1

  # Monitoring & Metrics
  - prometheus_client>=0.16.0

  # Additional pip dependencies
  - pip
  - pip:
      # RabbitMQ (legacy support)
      - pika>=1.3.0
      # PyQt5 Chart extensions (if not available via conda)
      - PyQtChart>=5.15.0
      # Additional pandas-ta if conda version insufficient
      - pandas-ta>=0.3.14b0
      # Finnhub API support (WebSocket connections)
      - finnhub-python>=2.4.0
      # MQTT async client (pip-only)
      - asyncio-mqtt>=0.16.0
      # dotenv support for environment variables

# Development dependencies (optional)
# Uncomment the section below for development environment
# dev_dependencies:
#   - pytest>=7.0.0
#   - pytest-asyncio>=0.21.0
#   - black>=22.0.0
#   - flake8>=5.0.0
#   - mypy>=1.0.0
#   - jupyter>=1.0.0
#   - ipython>=8.0.0

# Environment variables template
# Create a .env file in the project root with these variables:
# FINNHUB_API_KEY=your_finnhub_api_key_here
# RABBITMQ_HOST=localhost
# RABBITMQ_USER=guest
# RABBITMQ_PASS=guest
# LOG_LEVEL=INFO
# ACCOUNT_SIZE=60000.0
